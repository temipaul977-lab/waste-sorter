<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where does this go?</title>
  <style>
        .sub {
      color: #6b665e;
      margin-top: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      padding: 20px;
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      font-size: 26px;
    }
    .card {
      background: white;
      border: 1px solid #e6dfd2;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;

          .safety {
      background: #f4efe4;
      border: 1px solid #e6dfd2;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      margin-top: 24px;
    }
    }
  </style>
</head>
<body>

  <h1>Where does this go?</h1>
  <p class="sub">Search an item and find out which stream it belongs to.</p>
  <input id="q" placeholder="Try: bottle, nylon, battery">
  <div id="list"></div>

  <script>
        var items = [
      { name: "PET bottle", stream: "Buy-back", steps: "Rinse it, crush it, keep it dry. Sold by the kilo.", searchWords: "bottle pet plastic eva evabottle coke fanta sprite mineral drink" },
      { name: "HDPE container (keg, jerrycan)", stream: "Buy-back", steps: "Empty and rinse it. Remove the pump or cap. Do not mix with PET.", searchWords: "keg jerrycan gallon detergent shampoo container hard plastic" },
      { name: "Pure water sachet", stream: "General bin", steps: "Drain it and collect in bulk. Buyers pay almost nothing for it. Never burn it.", searchWords: "pure water nylon rubber sachet poly bag film water bag rubber nylon" },
      { name: "Thin nylon bag", stream: "General bin", steps: "Reuse it first if it is clean. Never burn it.", searchWords: "nylon bag polythene shopping cellophane plastic bag rubber" },
      { name: "Aluminium can", stream: "Buy-back", steps: "Empty and rinse it. Crush it. Highest value per kilo of the common materials.", searchWords: "can aluminium malt coke drink tin mineral" },
      { name: "Metal tin or scrap", stream: "Buy-back", steps: "Rinse out food. Bend sharp edges inward. Scrap metal always has a buyer.", searchWords: "tin milk tomato iron scrap metal panel" },
      { name: "Copper or aluminium wire", stream: "Buy-back", steps: "Strip it and sell by the kilo. Check the scale — short-changing is common.", searchWords: "copper wire aluminium wire cable scrap iron" },
      { name: "Glass bottle or jar", stream: "Reuse", steps: "Return it to the shop or a zobo seller. Reuse beats recycling here.", searchWords: "glass bottle jar beer wine koko" },
      { name: "Returnable bottle (crate deposit)", stream: "Reuse", steps: "Take it back to the distributor and collect your crate deposit. Small money, but it works.", searchWords: "returnable bottle crate deposit distributor fanta coke" },
      { name: "Clean sachet nylon in bulk", stream: "Reuse", steps: "Collected clean and dry, this can go to a mat weaver or sachet recycler instead of the bin.", searchWords: "pure water sachet nylon rubber bulk mat weaver craft" },
      { name: "Cardboard or carton", stream: "Buy-back", steps: "Flatten it and keep it dry. Wet or greasy cardboard loses its value.", searchWords: "carton cardboard box package" },
      { name: "Paper", stream: "Buy-back", steps: "Keep it dry and flat. Food-stained paper cannot be recycled.", searchWords: "paper newspaper book exercise office paper" },
      { name: "Food waste or peelings", stream: "Organic", steps: "Separate it from all packaging. Drain the liquid. Compost it if you have space.", searchWords: "food eba rice beans peel banana orange leftover organic compost" },
      { name: "Small electronics", stream: "Special", steps: "Remove the battery if you can. Take it to an e-waste drop-off. Never the bin.", searchWords: "phone charger cable electronics ewaste radio tv laptop" },
      { name: "Battery", stream: "Special", steps: "Tape the ends. Keep it separate. Take it to an e-waste or battery point.", searchWords: "battery aa powerbank torch phone battery" },
      { name: "Clothing or textile", stream: "Reuse", steps: "Wash and dry before donating. Only unwearable cloth goes to a textile buyer.", searchWords: "cloth clothes textile shirt fabric okrika wear" },
      { name: "Syringe, blade or medical waste", stream: "Special", steps: "Do not touch it bare-handed. Use a sealed container. Take it to a clinic.", searchWords: "syringe needle blade medical sharp bandage sanitary" },
      { name: "Tyre or rubber", stream: "Special", steps: "Take it to a vulcanizer. Never burn a tyre — the smoke is poisonous.", searchWords: "tyre tire rubber motor vulcanizer" }
    ];
    var list = document.getElementById("list");
    var q = document.getElementById("q");

    function show(term) {
      list.innerHTML = "";
      for (var i = 0; i < items.length; i = i + 1) {
        var item = items[i];
        var text = (item.name + " " + item.stream + " " + item.steps).toLowerCase();
                var searchable = (item.name + " " + item.searchWords).toLowerCase();
        if (searchable.indexOf(term) > -1) {
          list.innerHTML +=
            '<div class="card">' +
              '<h2>' + item.name + '</h2>' +
              '<p>' + item.stream + '</p>' +
              '<p>' + item.steps + '</p>' +
            '</div>';
        }
      }
    }

    q.addEventListener("input", function () {
      show(q.value.toLowerCase());
    });

    show("");

  </script>
  <div class="safety">
    <strong>If you're not sure:</strong> put it in the general waste bin.
    Do not guess the recycling bag — one wrong item can spoil a whole bale.
    Batteries, phones and syringes should never go in general waste.
  </div>
</body>
</html>
